<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصروفي</title>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f5f7;
  color: #171717;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 18px;
}

h1 {
  text-align: center;
  margin: 8px 0 4px;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 5px 18px rgba(0,0,0,.06);
}

.balance {
  text-align: center;
}

.balance-title {
  color: #777;
  font-size: 15px;
}

.balance-number {
  font-size: 36px;
  font-weight: 800;
  margin-top: 5px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.stat {
  background: #f5f5f5;
  padding: 12px 5px;
  border-radius: 14px;
  text-align: center;
}

.stat-title {
  font-size: 12px;
  color: #777;
}

.stat-value {
  font-weight: 700;
  margin-top: 4px;
}

.green {
  color: #159447;
}

.red {
  color: #d92d20;
}

.blue {
  color: #1769e0;
}

h2 {
  font-size: 20px;
  margin-top: 0;
}

input, select, button {
  width: 100%;
  padding: 14px;
  border-radius: 13px;
  border: 1px solid #ddd;
  font-size: 16px;
  margin-bottom: 10px;
  background: white;
}

button {
  border: none;
  background: #111;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

.monthly-item,
.transaction {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.monthly-item:last-child,
.transaction:last-child {
  border-bottom: none;
}

.item-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0f0f0;
  font-size: 21px;
}

.name {
  font-weight: 700;
}

.small {
  color: #888;
  font-size: 12px;
  margin-top: 3px;
}

.amount {
  font-weight: 800;
}

.delete {
  width: auto;
  padding: 7px 10px;
  margin: 0;
  background: #ffe7e5;
  color: #d92d20;
  font-size: 12px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 15px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.month-label {
  color: #777;
  font-size: 14px;
}

.warning {
  background: #fff3cd;
  color: #856404;
  padding: 12px;
  border-radius: 13px;
  margin-top: 12px;
  display: none;
}

.success {
  background: #e7f7ed;
  color: #137333;
  padding: 12px;
  border-radius: 13px;
  margin-top: 12px;
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <h1>💰 مصروفي</h1>
  <div class="subtitle">إدارة مصروفك ومدخولك الشهري</div>

  <!-- الرصيد -->
  <div class="card balance">
    <div class="balance-title">المبلغ المتبقي</div>
    <div class="balance-number" id="balance">$0.00</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-title">المدخول</div>
        <div class="stat-value green" id="income">$0</div>
      </div>

      <div class="stat">
        <div class="stat-title">الثابت</div>
        <div class="stat-value blue" id="fixed">$0</div>
      </div>

      <div class="stat">
        <div class="stat-title">اليومي</div>
        <div class="stat-value red" id="daily">$0</div>
      </div>
    </div>

    <div class="warning" id="warning">
      ⚠️ انتبه! مصروفك صار عالي مقارنة بمدخولك.
    </div>

    <div class="success" id="success">
      ✅ ممتاز! أنت محافظ على ميزانيتك.
    </div>
  </div>


  <!-- المدخول -->
  <div class="card">
    <h2>💵 المدخول الشهري</h2>

    <input
      type="number"
      id="incomeInput"
      placeholder="مثلاً 1000"
      inputmode="decimal"
    >

    <button onclick="saveIncome()">حفظ المدخول</button>
  </div>


  <!-- المصاريف الشهرية -->
  <div class="card">

    <div class="section-title">
      <h2>🏠 المصاريف الشهرية</h2>
      <div class="month-label" id="monthName"></div>
    </div>

    <input
      type="text"
      id="fixedName"
      placeholder="اسم المصروف، مثلاً إيجار"
    >

    <input
      type="number"
      id="fixedAmount"
      placeholder="المبلغ"
      inputmode="decimal"
    >

    <select id="fixedCategory">
      <option value="🏠">🏠 إيجار</option>
      <option value="⚡">⚡ كهربا</option>
      <option value="💧">💧 مي</option>
      <option value="📱">📱 تلفون</option>
      <option value="🌐">🌐 إنترنت</option>
      <option value="📺">📺 اشتراكات</option>
      <option value="📌">📌 غير ذلك</option>
    </select>

    <button onclick="addFixedExpense()">إضافة مصروف شهري</button>

    <div id="fixedList"></div>

  </div>


  <!-- المصروف اليومي -->
  <div class="card">

    <h2>🛒 مصروف يومي</h2>

    <input
      type="number"
      id="expenseAmount"
      placeholder="المبلغ"
      inputmode="decimal"
    >

    <select id="expenseCategory">
      <option value="🍔">🍔 أكل</option>
      <option value="☕">☕ قهوة</option>
      <option value="🚗">🚗 بنزين / مواصلات</option>
      <option value="🛍️">🛍️ تسوق</option>
      <option value="🎉">🎉 طلعات</option>
      <option value="💊">💊 صحة</option>
      <option value="📌">📌 غير ذلك</option>
    </select>

    <input
      type="text"
      id="expenseNote"
      placeholder="ملاحظة، مثلاً قهوة مع الشباب"
    >

    <button onclick="addExpense()">إضافة مصروف</button>

  </div>


  <!-- سجل المصاريف -->
  <div class="card">

    <div class="section-title">
      <h2>📋 سجل المصاريف</h2>
      <button
        onclick="clearDailyExpenses()"
        style="width:auto;padding:8px 12px;background:#ffe7e5;color:#d92d20;font-size:12px;"
      >
        مسح الكل
      </button>
    </div>

    <div id="expenseList"></div>

  </div>

</div>


<script>

let income = Number(localStorage.getItem("income")) || 0;

let fixedExpenses =
  JSON.parse(localStorage.getItem("fixedExpenses")) || [];

let dailyExpenses =
  JSON.parse(localStorage.getItem("dailyExpenses")) || [];


// --------------------
// التاريخ والشهر
// --------------------

function currentMonth() {
  const date = new Date();

  return date.toLocaleDateString("ar-LB", {
    month: "long",
    year: "numeric"
  });
}

document.getElementById("monthName").innerText = currentMonth();


// --------------------
// المدخول
// --------------------

function saveIncome() {

  const value =
    Number(document.getElementById("incomeInput").value);

  if (value <= 0) {
    alert("حط مبلغ صحيح يا برو 😄");
    return;
  }

  income = value;

  localStorage.setItem("income", income);

  document.getElementById("incomeInput").value = "";

  update();
}


// --------------------
// إضافة مصروف شهري
// --------------------

function addFixedExpense() {

  const name =
    document.getElementById("fixedName").value.trim();

  const amount =
    Number(document.getElementById("fixedAmount").value);

  const category =
    document.getElementById("fixedCategory").value;

  if (!name || amount <= 0) {
    alert("حط اسم المصروف والمبلغ.");
    return;
  }

  fixedExpenses.push({
    id: Date.now(),
    name: name,
    amount: amount,
    category: category
  });

  localStorage.setItem(
    "fixedExpenses",
    JSON.stringify(fixedExpenses)
  );

  document.getElementById("fixedName").value = "";
  document.getElementById("fixedAmount").value = "";

  update();
}


// --------------------
// حذف مصروف شهري
// --------------------

function deleteFixed(id) {

  fixedExpenses =
    fixedExpenses.filter(item => item.id !== id);

  localStorage.setItem(
    "fixedExpenses",
    JSON.stringify(fixedExpenses)
  );

  update();
}


// --------------------
// إضافة مصروف يومي
// --------------------

function addExpense() {

  const amount =
    Number(document.getElementById("expenseAmount").value);

  const category =
    document.getElementById("expenseCategory").value;

  const note =
    document.getElementById("expenseNote").value.trim();

  if (amount <= 0) {
    alert("حط مبلغ صحيح يا برو 😄");
    return;
  }

  dailyExpenses.unshift({

    id: Date.now(),

    amount: amount,

    category: category,

    note: note || "مصروف يومي",

    date: new Date().toLocaleDateString("ar-LB", {
      day: "numeric",
      month: "short",
      year: "numeric"
    })

  });

  localStorage.setItem(
    "dailyExpenses",
    JSON.stringify(dailyExpenses)
  );

  document.getElementById("expenseAmount").value = "";
  document.getElementById("expenseNote").value = "";

  update();
}


// --------------------
// حذف مصروف يومي
// --------------------

function deleteExpense(id) {

  dailyExpenses =
    dailyExpenses.filter(item => item.id !== id);

  localStorage.setItem(
    "dailyExpenses",
    JSON.stringify(dailyExpenses)
  );

  update();
}


// --------------------
// مسح المصاريف اليومية
// --------------------

function clearDailyExpenses() {

  if (!dailyExpenses.length) return;

  const confirmDelete =
    confirm("متأكد بدك تمسح كل المصاريف اليومية؟");

  if (!confirmDelete) return;

  dailyExpenses = [];

  localStorage.setItem(
    "dailyExpenses",
    JSON.stringify(dailyExpenses)
  );

  update();
}


// --------------------
// الحسابات
// --------------------

function getFixedTotal() {

  return fixedExpenses.reduce(
    (total, item) => total + Number(item.amount),
    0
  );
}


function getDailyTotal() {

  return dailyExpenses.reduce(
    (total, item) => total + Number(item.amount),
    0
  );
}


function getBalance() {

  return income -
    getFixedTotal() -
    getDailyTotal();
}


// --------------------
// تحديث الشاشة
// --------------------

function update() {

  const fixedTotal = getFixedTotal();

  const dailyTotal = getDailyTotal();

  const balance = getBalance();


  document.getElementById("income").innerText =
    "$" + income.toFixed(2);


  document.getElementById("fixed").innerText =
    "$" + fixedTotal.toFixed(2);


  document.getElementById("daily").innerText =
    "$" + dailyTotal.toFixed(2);


  document.getElementById("balance").innerText =
    "$" + balance.toFixed(2);


  renderFixed();

  renderDaily();

  checkBudget(balance);
}


// --------------------
// عرض المصاريف الشهرية
// --------------------

function renderFixed() {

  const container =
    document.getElementById("fixedList");

  if (!fixedExpenses.length) {

    container.innerHTML =
      '<div class="empty">ما في مصاريف شهرية مضافة بعد.</div>';

    return;
  }


  container.innerHTML =
    fixedExpenses.map(item => `

      <div class="monthly-item">

        <div class="item-left">

          <div class="icon">
            ${item.category}
          </div>

          <div>

            <div class="name">
              ${escapeHTML(item.name)}
            </div>

            <div class="small">
              مصروف شهري ثابت
            </div>

          </div>

        </div>

        <div style="text-align:left">

          <div class="amount blue">
            $${Number(item.amount).toFixed(2)}
          </div>

          <button
            class="delete"
            onclick="deleteFixed(${item.id})"
          >
            حذف
          </button>

        </div>

      </div>

    `).join("");
}


// --------------------
// عرض المصاريف اليومية
// --------------------

function renderDaily() {

  const container =
    document.getElementById("expenseList");

  if (!dailyExpenses.length) {

    container.innerHTML =
      '<div class="empty">ما في مصاريف يومية بعد.</div>';

    return;
  }


  container.innerHTML =
    dailyExpenses.map(item => `

      <div class="transaction">

        <div class="item-left">

          <div class="icon">
            ${item.category}
          </div>

          <div>

            <div class="name">
              ${escapeHTML(item.note)}
            </div>

            <div class="small">
              ${item.date}
            </div>

          </div>

        </div>

        <div style="text-align:left">

          <div class="amount red">
            -$${Number(item.amount).toFixed(2)}
          </div>

          <button
            class="delete"
            onclick="deleteExpense(${item.id})"
          >
            حذف
          </button>

        </div>

      </div>

    `).join("");
}


// --------------------
// تنبيه الميزانية
// --------------------

function checkBudget(balance) {

  const warning =
    document.getElementById("warning");

  const success =
    document.getElementById("success");


  warning.style.display = "none";

  success.style.display = "none";


  if (!income) return;


  if (balance < 0) {

    warning.innerText =
      "🚨 انتبه! صرفت أكتر من مدخولك.";

    warning.style.display = "block";

  } else if (balance <= income * 0.15) {

    warning.innerText =
      "⚠️ انتبه! ما ضل معك إلا جزء صغير من مدخولك.";

    warning.style.display = "block";

  } else {

    success.style.display = "block";

  }

}


// --------------------
// حماية النصوص
// --------------------

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


// تشغيل التطبيق
update();

</script>

</body>
</html>
