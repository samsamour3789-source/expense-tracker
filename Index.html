<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Masrofi">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <title>Masrofi</title>
</head>

<body>

  <div class="app">

    <header class="topbar">
      <div>
        <h1>Masrofi</h1>
        <p>Personal Expense Tracker</p>
      </div>

      <button id="languageBtn" class="icon-btn">EN</button>
    </header>

    <main>

      <section class="balance-card">
        <p>Remaining Balance</p>
        <h2 id="remainingBalance">$0.00</h2>
      </section>

      <section class="stats">

        <div class="stat-card">
          <span>Income</span>
          <strong id="incomeTotal">$0.00</strong>
        </div>

        <div class="stat-card">
          <span>Fixed</span>
          <strong id="fixedTotal">$0.00</strong>
        </div>

        <div class="stat-card">
          <span>Daily</span>
          <strong id="dailyTotal">$0.00</strong>
        </div>

      </section>

      <section class="card">

        <div class="section-title">
          <h2>Monthly Income</h2>
        </div>

        <div class="form-row">

          <input
            type="number"
            id="incomeInput"
            placeholder="Enter income"
            min="0"
          >

          <select id="incomeCurrency">
            <option value="USD">USD</option>
            <option value="LBP">LBP</option>
            <option value="SYP">SYP</option>
          </select>

        </div>

        <button id="saveIncomeBtn" class="primary-btn">
          Save Income
        </button>

      </section>

      <section class="card">

        <div class="section-title">
          <h2>Daily Expense</h2>
        </div>

        <input
          type="number"
          id="expenseAmount"
          placeholder="Amount"
          min="0"
        >

        <select id="expenseCategory">
          <option value="Food">Food</option>
          <option value="Coffee">Coffee</option>
          <option value="Transportation">Transportation</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Health">Health</option>
          <option value="Other">Other</option>
        </select>

        <input
          type="text"
          id="expenseNote"
          placeholder="Note"
        >

        <button id="addExpenseBtn" class="primary-btn">
          Add Expense
        </button>

      </section>

      <section class="card">

        <div class="section-title">
          <h2>Monthly Budget</h2>
        </div>

        <input
          type="number"
          id="budgetInput"
          placeholder="Enter monthly budget"
          min="0"
        >

        <button id="saveBudgetBtn" class="primary-btn">
          Save Budget
        </button>

        <div class="progress-container">
          <div id="budgetProgress" class="progress"></div>
        </div>

        <p id="budgetMessage" class="budget-message">
          No budget set
        </p>

      </section>

      <section class="card">

        <div class="section-title">
          <h2>Transactions</h2>
        </div>

        <div id="transactionsList" class="transactions-list">
          <p class="empty">
            No transactions yet.
          </p>
        </div>

      </section>

    </main>

    <footer>
      <p>Masrofi © 2026</p>
    </footer>

  </div>

  <script src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>

</body>
</html>
